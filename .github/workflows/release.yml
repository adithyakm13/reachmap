name: Release build

# Builds the frontend, the wheel and the sdist for a tag `v*` (or by hand), keeps them as workflow artifacts and installs the wheel into a
# clean environment on each supported Python. A tag push never publishes. Publishing to PyPI happens only when the workflow is run by hand
# with `publish: pypi` and `ref` set to a tag: it then builds that tag, runs every check, and uploads those exact files through PyPI
# trusted publishing (OpenID Connect, environment `pypi`): no token or secret anywhere. See docs/releasing.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build, for example v0.1.0 (empty: the branch the run starts from)"
        required: false
        default: ""
      publish:
        description: "Publish the build of that tag to PyPI"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Packaging tools (development tools only, never imported by the package)
        run: python -m pip install setuptools build
      - name: The tag names the version in the package
        if: startsWith(github.ref, 'refs/tags/') || inputs.ref != ''
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          version=$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("reachmap/__init__.py").read()).group(1))')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
      - name: Build the sdist and the wheel
        run: python -m build
      - name: The wheel holds the workspace and nothing it should not
        run: |
          python -m zipfile -l dist/reachmap-*.whl | tee wheel.txt
          grep -q "reachmap/runner/static/index.html" wheel.txt
          grep -q "reachmap/runner/static/assets/.*\.js" wheel.txt
          grep -q "reachmap/runner/static/assets/.*\.css" wheel.txt
          grep -q "reachmap/runner/static/THIRD_PARTY_LICENSES.txt" wheel.txt
          grep -q "licenses/LICENSE" wheel.txt
          if grep -E "tests/|fixtures|node_modules|\.claude|briefs|screenshots|\.map( |$)|\.tsx?( |$)" wheel.txt; then echo "unexpected files in the wheel"; exit 1; fi
          unzip -p dist/reachmap-*.whl 'reachmap-*.dist-info/METADATA' > metadata.txt
          if grep -q "^Requires-Dist" metadata.txt; then echo "the wheel declares a dependency"; exit 1; fi
          tar tzf dist/reachmap-*.tar.gz | tee sdist.txt
          if grep -E "/tests/|fixtures|node_modules|\.claude|briefs|screenshots" sdist.txt; then echo "unexpected files in the sdist"; exit 1; fi
          grep -q "frontend/dist/THIRD_PARTY_LICENSES.txt" sdist.txt
          for name in CHANGELOG.md SECURITY.md CONTRIBUTING.md; do grep -q "/$name\$" sdist.txt || { echo "$name is missing from the sdist"; exit 1; }; done
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Configure git for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Install the wheel into a clean environment and run the commands
        run: python tests/release/check_install.py --wheel dist/reachmap-*.whl --python python

  publish:
    # Only by hand, only for a tag, only after the build and every install check passed. Trusted publishing: PyPI trusts this repository,
    # this workflow file and the environment `pypi`; the job gets a short-lived token from GitHub's OpenID Connect provider.
    needs: [build, install]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi' && startsWith(inputs.ref, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/reachmap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
