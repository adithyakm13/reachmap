# The M16 Spring Boot fixture workspace (tests/fixtures/spring/): a Spring Boot service in Java with one Kotlin controller, and a small
# React client of its API. Every remote is a path under ${REACHMAP_FIXTURES}: the directory tests/fixtures/sb_build.py wrote the two
# repositories into. Unset, the remotes are "not configured" and the file does not load.
workspace = "sb"

[limits]
hops = 3
hub_importers = 50
distinct_max = 3
timeout_s = 900

[repos."acme/ledger"]
host = "git"
remote = "${REACHMAP_FIXTURES}/sb-ledger"
language = "java"
roles = ["backend"]
branches = ["main"]
entry_points = { kind = "spring" }
tests = { markers = ["src/test/"] }

[repos."acme/ledger-web"]
host = "git"
remote = "${REACHMAP_FIXTURES}/sb-web"
language = "typescript"
roles = ["frontend"]
branches = ["main"]
aliases = { from = "tsconfig.json" }
entry_points = { kind = "react-router", routes_glob = "src/routes.tsx" }
http_client = { kind = "endpoints-file", path = "src/api/endpoints.ts" }

[[edges]]
kind = "http"
from = "acme/ledger-web"
to = "acme/ledger"
